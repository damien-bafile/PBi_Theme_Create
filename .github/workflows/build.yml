name: Build

on:
  workflow_dispatch:
  push:
    branches: ["claude/python-json-theme-qt-gui-lxksys"]
    tags: ["v*"]

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller build_exe.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PowerBI_Theme_Creator-windows
          path: dist/PowerBI_Theme_Creator.exe
          if-no-files-found: error

  python-package:
    name: Python wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pbitheme-dist
          path: dist/*
          if-no-files-found: error
