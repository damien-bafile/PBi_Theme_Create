name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.1.0). Leave blank to only build artifacts."
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller build_exe.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PowerBI_Theme_Creator-windows
          path: dist/PowerBI_Theme_Creator.exe
          if-no-files-found: error

  python-package:
    name: Python wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pbitheme-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows-exe, python-package]
    # On a version-tag push, or a manual run that supplies a version.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            TARGET_ARGS=""
          else
            TAG="${{ inputs.version }}"
            TARGET_ARGS="--target ${GITHUB_SHA}"
          fi
          echo "Releasing $TAG"
          FILES="artifacts/PowerBI_Theme_Creator-windows/PowerBI_Theme_Creator.exe artifacts/pbitheme-dist/*"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" $FILES \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              $TARGET_ARGS
          fi
