name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # Qt runs head-less on CI.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Conformance tests (unittest)
        run: python -m unittest discover -s tests -v

      - name: Theme export test
        run: python test_theme_export.py

      - name: Dynamic preview test
        run: python test_dynamic_preview.py

      - name: Feature test
        run: python test_all_features.py
